services:
  - type: web
    name: trustmedz-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: node create-admin.js && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CNOM_PORTAL_NATIONAL
        sync: false
      - key: CNOM_FALLBACK_SOURCE_1
        sync: false
      - key: CNOM_FALLBACK_SOURCE_2
        sync: false
      - key: CNOM_SCRAPE_DELAY_MS
        value: "2000"
      - key: CNOM_SCRAPE_TIMEOUT_MS
        value: "30000"
